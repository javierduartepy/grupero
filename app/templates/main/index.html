{% extends 'base.html' %}
{% block title %}GruPero — Inicio{% endblock %}

{% block content %}

<canvas id="nodesCanvas"></canvas>

<div class="nodes-content">
  <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;">

    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;opacity:0.35">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
      <span style="font-family:'Share Tech Mono',monospace;font-size:15px;letter-spacing:3px;color:currentColor">GruPero</span>
    </div>

    <h1 id="titulo" style="font-family:'Share Tech Mono',monospace;font-size:30px;font-weight:400;margin:0 0 44px;color:var(--bs-body-color);letter-spacing:2px;line-height:1.3;white-space:pre-line"></h1>

    <div style="display:flex;gap:32px">
      <div id="card-personas" style="cursor:default;background:rgba(128,128,128,0.08);border:0.5px solid rgba(128,128,128,0.2);border-radius:12px;padding:20px 36px;transition:transform 0.12s ease">
        <p style="font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:3px;color:var(--bs-secondary-color);margin:0 0 6px">PERSONAS</p>
        <p id="num-personas" style="font-family:'Share Tech Mono',monospace;font-size:40px;font-weight:400;color:var(--bs-body-color);margin:0">_</p>
      </div>
      <div id="card-grupos" style="cursor:default;background:rgba(128,128,128,0.08);border:0.5px solid rgba(128,128,128,0.2);border-radius:12px;padding:20px 36px;transition:transform 0.12s ease">
        <p style="font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:3px;color:var(--bs-secondary-color);margin:0 0 6px">GRUPOS</p>
        <p id="num-grupos" style="font-family:'Share Tech Mono',monospace;font-size:40px;font-weight:400;color:var(--bs-body-color);margin:0">_</p>
      </div>
    </div>

  </div>
</div>

<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
  body.dark-mode #titulo {
  color: #ffffff !important;
}

body.dark-mode #num-personas,
body.dark-mode #num-grupos {
  color: #ffffff !important;
}
  #nodesCanvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
  }
  .nodes-content {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: calc(100vh - 120px);
  }
</style>

{% endblock %}

{% block scripts %}
<script>
  const canvas = document.getElementById('nodesCanvas');
  const ctx = canvas.getContext('2d');
  let W, H, nodes = [], mouse = { x: -9999, y: -9999 };
  const N = 180, DIST = 200, MDIST = 150;

  function isDark() { return document.body.classList.contains('dark-mode'); }
  function col() { return isDark() ? [255,255,255] : [30,80,180]; }

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  function mk() { return { ox: Math.random()*W, oy: Math.random()*H, x: 0, y: 0 }; }

  function drawCylinder(x,y,w,h,a){
    const [r,g,b]=col(); ctx.save(); ctx.globalAlpha=a;
    ctx.strokeStyle=`rgba(${r},${g},${b},0.5)`; ctx.lineWidth=1;
    const ry=h*0.15;
    ctx.beginPath(); ctx.ellipse(x,y-h/2+ry,w/2,ry,0,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x-w/2,y-h/2+ry); ctx.lineTo(x-w/2,y+h/2-ry);
    ctx.ellipse(x,y+h/2-ry,w/2,ry,0,0,Math.PI); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+w/2,y-h/2+ry); ctx.lineTo(x+w/2,y+h/2-ry); ctx.stroke();
    ctx.restore();
  }

  function drawMemBlock(x,y,w,h,a){
    const [r,g,b]=col(); ctx.save(); ctx.globalAlpha=a;
    ctx.strokeStyle=`rgba(${r},${g},${b},0.5)`; ctx.lineWidth=1;
    const rows=6, rh=h/rows;
    ctx.strokeRect(x-w/2,y-h/2,w,h);
    for(let i=1;i<rows;i++){ ctx.beginPath(); ctx.moveTo(x-w/2,y-h/2+i*rh); ctx.lineTo(x+w/2,y-h/2+i*rh); ctx.stroke(); }
    [0,2,4].forEach(i=>{ ctx.fillStyle=`rgba(${r},${g},${b},0.06)`; ctx.fillRect(x-w/2+1,y-h/2+i*rh+1,w-2,rh-2); });
    ctx.restore();
  }

  function drawCPU(x,y,s,a){
    const [r,g,b]=col(); ctx.save(); ctx.globalAlpha=a;
    ctx.strokeStyle=`rgba(${r},${g},${b},0.5)`; ctx.lineWidth=1;
    ctx.strokeRect(x-s/2,y-s/2,s,s);
    ctx.strokeRect(x-s*0.28,y-s*0.28,s*0.56,s*0.56);
    ctx.beginPath(); ctx.moveTo(x-s*0.28,y); ctx.lineTo(x+s*0.28,y); ctx.moveTo(x,y-s*0.28); ctx.lineTo(x,y+s*0.28); ctx.stroke();
    for(let i=0;i<3;i++){
      const off=(i-1)*s*0.22;
      ctx.beginPath();
      ctx.moveTo(x+off,y-s/2); ctx.lineTo(x+off,y-s/2-12);
      ctx.moveTo(x+off,y+s/2); ctx.lineTo(x+off,y+s/2+12);
      ctx.moveTo(x-s/2,y+off); ctx.lineTo(x-s/2-12,y+off);
      ctx.moveTo(x+s/2,y+off); ctx.lineTo(x+s/2+12,y+off);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawPageTable(x,y,w,h,a){
    const [r,g,b]=col(); ctx.save(); ctx.globalAlpha=a;
    ctx.strokeStyle=`rgba(${r},${g},${b},0.5)`; ctx.lineWidth=1;
    const rows=5, rh=h/rows;
    ctx.strokeRect(x-w/2,y-h/2,w,h);
    ctx.beginPath(); ctx.moveTo(x-w/2+w*0.45,y-h/2); ctx.lineTo(x-w/2+w*0.45,y+h/2); ctx.stroke();
    for(let i=1;i<rows;i++){ ctx.beginPath(); ctx.moveTo(x-w/2,y-h/2+i*rh); ctx.lineTo(x+w/2,y-h/2+i*rh); ctx.stroke(); }
    ctx.fillStyle=`rgba(${r},${g},${b},0.1)`; ctx.fillRect(x-w/2+1,y-h/2+2*rh+1,w-2,rh-2);
    ctx.fillStyle=`rgba(${r},${g},${b},0.45)`; ctx.font='10px monospace';
    ctx.fillText('P',x-w/2+8,y-h/2+14); ctx.fillText('D',x-w/2+w*0.55,y-h/2+14);
    ctx.restore();
  }

  function drawArrow(x1,y1,x2,y2,a){
    const [r,g,b]=col(); ctx.save(); ctx.globalAlpha=a;
    ctx.strokeStyle=`rgba(${r},${g},${b},0.35)`; ctx.lineWidth=0.8;
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    const ang=Math.atan2(y2-y1,x2-x1), as=8;
    [0,Math.PI].forEach(base=>{
      const aa=base===0?ang:ang+Math.PI, px=base===0?x2:x1, py=base===0?y2:y1;
      ctx.beginPath(); ctx.moveTo(px,py);
      ctx.lineTo(px-as*Math.cos(aa-0.4),py-as*Math.sin(aa-0.4));
      ctx.moveTo(px,py);
      ctx.lineTo(px-as*Math.cos(aa+0.4),py-as*Math.sin(aa+0.4));
      ctx.stroke();
    });
    ctx.restore();
  }

  function draw() {
    ctx.clearRect(0,0,W,H);
    const [r,g,b] = col();

    for(let n of nodes){
      const dx=mouse.x-n.ox, dy=mouse.y-n.oy, d=Math.hypot(dx,dy);
      if(d<MDIST&&d>0){ const p=(MDIST-d)/MDIST*0.3; n.x=n.ox+dx*p; n.y=n.oy+dy*p; }
      else{ n.x+=(n.ox-n.x)*0.08; n.y+=(n.oy-n.y)*0.08; }
    }

    for(let i=0;i<nodes.length;i++){
      for(let j=i+1;j<nodes.length;j++){
        const d=Math.hypot(nodes[i].x-nodes[j].x,nodes[i].y-nodes[j].y);
        if(d<DIST){ ctx.beginPath(); ctx.strokeStyle=`rgba(${r},${g},${b},${(1-d/DIST)*.3})`; ctx.lineWidth=.7; ctx.moveTo(nodes[i].x,nodes[i].y); ctx.lineTo(nodes[j].x,nodes[j].y); ctx.stroke(); }
      }
      const dm=Math.hypot(nodes[i].x-mouse.x,nodes[i].y-mouse.y);
      if(dm<MDIST){ ctx.beginPath(); ctx.strokeStyle=`rgba(${r},${g},${b},${(1-dm/MDIST)*.7})`; ctx.lineWidth=1; ctx.moveTo(nodes[i].x,nodes[i].y); ctx.lineTo(mouse.x,mouse.y); ctx.stroke(); }
    }

    for(let n of nodes){ ctx.beginPath(); ctx.arc(n.x,n.y,2.5,0,Math.PI*2); ctx.fillStyle=`rgba(${r},${g},${b},0.75)`; ctx.fill(); }
    if(mouse.x>0){ ctx.beginPath(); ctx.arc(mouse.x,mouse.y,5,0,Math.PI*2); ctx.fillStyle=`rgba(${r},${g},${b},0.9)`; ctx.fill(); }

    drawCPU(W*0.10, H*0.28, 60, 0.55);
    drawMemBlock(W*0.36, H*0.22, 55, 80, 0.5);
    drawCylinder(W*0.75, H*0.25, 50, 70, 0.5);
    drawPageTable(W*0.65, H*0.75, 70, 80, 0.5);
    drawMemBlock(W*0.88, H*0.65, 45, 70, 0.45);
    drawMemBlock(W*0.12, H*0.72, 50, 75, 0.45);
    drawArrow(W*0.10+32, H*0.28, W*0.36-28, H*0.22, 0.35);
    drawArrow(W*0.36+28, H*0.22, W*0.75-28, H*0.25, 0.35);
    drawArrow(W*0.65+10, H*0.75, W*0.88-23, H*0.65, 0.3);

    requestAnimationFrame(draw);
  }

  const cards = [document.getElementById('card-personas'), document.getElementById('card-grupos')];
  document.addEventListener('mousemove', e => {
    mouse.x = e.clientX; mouse.y = e.clientY;
    cards.forEach(card => {
      const rect = card.getBoundingClientRect();
      const cx = rect.left+rect.width/2, cy = rect.top+rect.height/2;
      const dx = e.clientX-cx, dy = e.clientY-cy, dist = Math.hypot(dx,dy);
      if(dist<200&&dist>0){ const f=(200-dist)/200*8; card.style.transform=`translate(${dx/dist*f}px,${dy/dist*f}px)`; }
      else card.style.transform='translate(0,0)';
    });
  });
  document.addEventListener('mouseleave', () => {
    mouse.x=-9999; mouse.y=-9999;
    cards.forEach(c => c.style.transform='translate(0,0)');
  });

  function typewriter(el, text, delay=80){
    el.textContent=''; let i=0;
    const t=setInterval(()=>{ el.textContent+=text[i++]; if(i>=text.length) clearInterval(t); }, delay);
  }

  setTimeout(()=>typewriter(document.getElementById('titulo'),'Arquitectura y\nSistema Operativo',45),200);
  setTimeout(()=>typewriter(document.getElementById('num-personas'),'{{ total_personas }}',120),1800);
  setTimeout(()=>typewriter(document.getElementById('num-grupos'),'{{ total_grupos }}',120),2200);

  resize();
  nodes = Array.from({length:N}, mk);
  window.addEventListener('resize', ()=>{ resize(); nodes=Array.from({length:N},mk); });
  draw();
</script>
{% endblock %}
