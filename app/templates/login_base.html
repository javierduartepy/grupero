<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}GruPero{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #f8f9fa; font-family: 'Segoe UI', sans-serif; }
    body.dark-mode { background-color: #121212 !important; color: #e0e0e0 !important; }
    .btn-primary {
      background: linear-gradient(135deg, #1a2e50, #2e6ab5) !important;
      border-color: transparent !important;
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #152540, #245a9e) !important;
    }
  </style>
</head>
<body>
  {% block content %}{% endblock %}
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
